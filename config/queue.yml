default: &default
  dispatchers:
    - polling_interval: <%= ENV.fetch("JOB_DISPATCH_INTERVAL", 1) %>
      batch_size: 500
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: <%= ENV.fetch("JOB_POLL_INTERVAL", 1) %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
